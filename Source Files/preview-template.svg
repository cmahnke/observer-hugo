     y="228"
     x="150"
     style="image-rendering:optimizeQuality"
     preserveAspectRatio="xMidYMid meet"
     height="250"
     width="900" />
  <text
     id="text-container"
     xml:space="preserve"
     style="font-style:normal;font-weight:normal;font-size:40px;line-height:1.2;font-family:'FuturaRenner';text-align:center;white-space:pre;shape-inside:url(#textbox);display:inline;fill:#333333;fill-opacity:1;stroke:none">Titel</text>
