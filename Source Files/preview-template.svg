<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1200"
   height="630"
   viewBox="0 0 1200 630"
   version="1.1"
   id="svg8"
   inkscape:version="1.4.4"
   sodipodi:docname="preview-template.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false" />
  <defs
     id="defs2">
    <rect
       id="textbox"
       x="75"
       y="516"
       width="1050"
       height="104" />
    <style
       id="preview-fonts">
        @font-face {
          font-family: 'FuturaRenner';
          font-style: normal;
          font-weight: 400;
          src: local('FuturaRenner'),
               url('../../projektemacher-base/static/fonts/FuturaRenner-Regular.woff2') format('woff2'), /* Super Modern Browsers */
               url('../../projektemacher-base/static/fonts/FuturaRenner-Regular.woff') format('woff'), /* Modern Browsers */
               url('../../projektemacher-base/static/fonts/FuturaRenner-Regular.ttf') format('truetype');
        }
    </style>
  </defs>
  <rect
     id="background"
     width="1200"
     height="630"
     x="0"
     y="0"
     style="fill:#ffffff"
     inkscape:label="background" />
  <text
     id="masthead"
     x="600"
     y="176"
     style="font-style:normal;font-weight:normal;font-size:68px;line-height:1;font-family:'FuturaRenner';text-align:center;text-anchor:middle;fill:#333333;fill-opacity:1;stroke:none"
     inkscape:label="masthead">Blog title</text>
  <rect
     id="rule-thick"
     x="100"
     y="196"
     width="1000"
     height="3"
     style="fill:#333333" />
  <rect
     id="rule-thin"
     x="100"
     y="203"
     width="1000"
     height="1"
     style="fill:#333333" />
  <rect
     id="highlight"
     x="0"
     y="500"
     width="1200"
     height="130"
     style="fill:#fff882"
     inkscape:label="highlight" />
  <image
     id="preview-image"
