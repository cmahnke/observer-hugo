{{/* Include PDF viewer */}}
{{- with .Page.Resources.GetMatch "pdf-viewer" -}}
    <div class="pdf-viewer">
        <div data-pdf-viewer="{{ .RelPermalink }}"></div>
    </div>
    <div class="share">
        <a href="{{ .RelPermalink }}" class="pdf-link">{{ i18n "pdfDownload" | default "PDF Download" }}</a>
    </div>
{{- end -}}
